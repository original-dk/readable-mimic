[build-system]
requires = ["uv_build>=0.8.19,<0.10.0"]
build-backend = "uv_build"

[project]
name = "readable-mimic"
version = "0.1.0"
description = "Modular FP32 actor-critic world-model motion tracking"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.9.0", "numpy", "mujoco==3.11.0", "imageio[ffmpeg]>=2.37"]

[project.optional-dependencies]
mujoco = ["mjlab==1.6.0", "mjviser==0.0.16", "warp-lang==1.16.0"]
genesis = ["genesis-world==1.4.5"]
deploy = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.3",
]
retarget = [
    "daqp>=0.7",
    "mink==1.2.0",
    "scipy>=1.13",
]

[tool.uv]
conflicts = [[{ extra = "mujoco" }, { extra = "genesis" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
readable-mimic = "readable_mimic.train:main"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
